<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Training</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="catalog-title">Выбери свой продукт</h1>
    <ul class="product-grid">
        <template id="product-card-template">
        <li class="product-card">
            <div class="product-card__image-box">
                <img class="product-card__image" src="img/photo_1.png" alt="Увлажняющий мусс" />
            </div>
            <span class="product-card__category">Для нормальной кожи</span>
            <h2 class="product-card__name">Увлажняющий мусс</h2>
            <p class="product-card__description">Глубоко увлажняет кожу лица, оставляя ее мягкой и гладкой.</p>
            
            <div class="product-card__ingredients">
                <span class="product-card__ingredients-title">Состав:</span>
                <ul class="product-card__ingredients-list">
                  
                </ul>
            </div>
            
            <div class="product-card__price-row">
                <b class="product-card__price-label">Цена</b>
                <span class="product-card__price-value">2 750 ₽</span>
            </div>
        </li>
</template>
  
    </ul>

 <script src="homework-10.js" type="module"></script>
</body>
</html>
